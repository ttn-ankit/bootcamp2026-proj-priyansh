email.activation.body=ई-कॉमर्स प्लेटफॉर्म में आपका स्वागत है!\n\nकृपया नीचे दिए गए लिंक का उपयोग करके अपना खाता सक्रिय करें:\n\n{0}\n\nयह लिंक 3 घंटे में समाप्त हो जाएगा।\n\nयदि आपने पंजीकरण नहीं किया है, तो इस ईमेल को अनदेखा करें।
email.seller_registration.body=प्रिय विक्रेता,\n\nआपका विक्रेता खाता सफलतापूर्वक बनाया गया है।\n\nहमारी टीम आपके विवरणों की समीक्षा करेगी और जल्द ही आपके खाते को अनुमोदित करेगी।\n\nअनुमोदन प्रक्रिया पूर्ण होने पर आपको सूचित किया जाएगा।\n\nसादर,\nई-कॉमर्स टीम
email.account_locked.body=कई असफल लॉगिन प्रयासों के कारण आपका खाता लॉक कर दिया गया है।\n\nअपना खाता अनलॉक करने के लिए कृपया सहायता से संपर्क करें।\n\nसादर,\nई-कॉमर्स टीम
email.password_reset.body=हमें आपके पासवर्ड को रीसेट करने का अनुरोध प्राप्त हुआ है।\n\nइसे रीसेट करने के लिए नीचे दिए गए लिंक का उपयोग करें:\n\n{0}\n\nयह लिंक जल्द ही समाप्त हो जाएगा। यदि आपने इसका अनुरोध नहीं किया है, तो आप इस ईमेल को अनदेखा कर सकते हैं।
email.password_changed.body=आपका पासवर्ड हाल ही में बदला गया था।\n\nयदि आपने यह कार्य नहीं किया है, तो तुरंत सहायता से संपर्क करें।\n\nसादर,\nई-कॉमर्स टीम
email.account_activated.body=खुशखबरी! आपका खाता एक व्यवस्थापक द्वारा सफलतापूर्वक सक्रिय कर दिया गया है।\n\nअब आप लॉग इन कर सकते हैं और प्लेटफॉर्म की सभी सुविधाओं का उपयोग कर सकते हैं।\n\nसादर,\nई-कॉमर्स टीम
email.account_deactivated.body=यह एक सूचना है कि आपका खाता एक व्यवस्थापक द्वारा निष्क्रिय कर दिया गया है।\n\nयदि आपको लगता है कि यह एक त्रुटि है, तो सहायता से संपर्क करें।\n\nसादर,\nई-कॉमर्स टीम
