email.activation.body=¡Bienvenido a la plataforma de comercio electrónico!\n\nPor favor activa tu cuenta usando el enlace a continuación:\n\n{0}\n\nEste enlace expirará en 3 horas.\n\nSi no te registraste, ignora este correo.
email.seller_registration.body=Estimado vendedor,\n\nTu cuenta de vendedor ha sido creada exitosamente.\n\nNuestro equipo revisará tus detalles y aprobará tu cuenta en breve.\n\nSerás notificado una vez que el proceso de aprobación esté completo.\n\nSaludos,\nEquipo de E-commerce
email.account_locked.body=Tu cuenta ha sido bloqueada debido a múltiples intentos fallidos de inicio de sesión.\n\nPor favor contacta al soporte para desbloquear tu cuenta.\n\nSaludos,\nEquipo de E-commerce
email.password_reset.body=Recibimos una solicitud para restablecer tu contraseña.\n\nUsa el enlace a continuación para restablecerla:\n\n{0}\n\nEste enlace expirará pronto. Si no solicitaste esto, puedes ignorar este correo.
email.password_changed.body=Tu contraseña fue cambiada recientemente.\n\nSi no realizaste esta acción, contacta al soporte inmediatamente.\n\nSaludos,\nEquipo de E-commerce
email.account_activated.body=¡Buenas noticias! Tu cuenta ha sido activada exitosamente por un administrador.\n\nAhora puedes iniciar sesión y acceder a todas las funciones de la plataforma.\n\nSaludos,\nEl equipo de E-Commerce
email.account_deactivated.body=Esta es una notificación de que tu cuenta ha sido desactivada por un administrador.\n\nSi crees que esto es un error, contacta al soporte.\n\nSaludos,\nEl equipo de E-Commerce

