email.activation.body=Willkommen bei der E-Commerce-Plattform!\n\nBitte aktivieren Sie Ihr Konto über den folgenden Link:\n\n{0}\n\nDieser Link läuft in 3 Stunden ab.\n\nWenn Sie sich nicht registriert haben, ignorieren Sie diese E-Mail.
email.seller_registration.body=Lieber Verkäufer,\n\nIhr Verkäuferkonto wurde erfolgreich erstellt.\n\nUnser Team wird Ihre Angaben prüfen und Ihr Konto in Kürze freigeben.\n\nSie werden benachrichtigt, sobald der Genehmigungsprozess abgeschlossen ist.\n\nMit freundlichen Grüßen,\nE-Commerce-Team
email.account_locked.body=Ihr Konto wurde aufgrund mehrerer fehlgeschlagener Anmeldeversuche gesperrt.\n\nBitte wenden Sie sich an den Support, um Ihr Konto zu entsperren.\n\nMit freundlichen Grüßen,\nE-Commerce-Team
email.password_reset.body=Wir haben eine Anfrage zum Zurücksetzen Ihres Passworts erhalten.\n\nVerwenden Sie den folgenden Link zum Zurücksetzen:\n\n{0}\n\nDieser Link läuft bald ab. Wenn Sie dies nicht angefordert haben, können Sie diese E-Mail ignorieren.
email.password_changed.body=Ihr Passwort wurde kürzlich geändert.\n\nWenn Sie diese Aktion nicht durchgeführt haben, wenden Sie sich sofort an den Support.\n\nMit freundlichen Grüßen,\nE-Commerce-Team
email.account_activated.body=Gute Nachrichten! Ihr Konto wurde erfolgreich von einem Administrator aktiviert.\n\nSie können sich jetzt anmelden und alle Funktionen der Plattform nutzen.\n\nMit freundlichen Grüßen,\nDas E-Commerce-Team
email.account_deactivated.body=Dies ist eine Benachrichtigung, dass Ihr Konto von einem Administrator deaktiviert wurde.\n\nWenn Sie glauben, dass dies ein Fehler ist, wenden Sie sich an den Support.\n\nMit freundlichen Grüßen,\nDas E-Commerce-Team

