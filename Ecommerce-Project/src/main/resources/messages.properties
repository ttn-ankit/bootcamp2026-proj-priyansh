email.account_locked.body=Your account has been locked due to multiple failed login attempts.\n\nPlease contact support to unlock your account.\n\nRegards,\nEcommerce Team
email.password_reset.body=We received a request to reset your password.\n\nUse the link below to reset it:\n\n{0}\n\nThis link will expire soon. If you did not request this, you can ignore this email.
