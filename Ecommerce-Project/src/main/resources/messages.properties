email.account_activated.body=Good news! Your account has been successfully activated by an administrator.\n\nYou can now log in and access all features of the platform.\n\nRegards,\nThe E-Commerce Team
email.account_deactivated.body=This is a notification that your account has been deactivated by an administrator.\n\nIf you believe this is an error, please contact support.\n\nRegards,\nThe E-Commerce Team