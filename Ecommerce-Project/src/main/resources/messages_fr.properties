email.activation.body=Bienvenue sur la plateforme e-commerce !\n\nVeuillez activer votre compte en utilisant le lien ci-dessous :\n\n{0}\n\nCe lien expirera dans 3 heures.\n\nSi vous ne vous êtes pas inscrit, ignorez cet e-mail.
email.seller_registration.body=Cher vendeur,\n\nVotre compte vendeur a été créé avec succès.\n\nNotre équipe examinera vos détails et approuvera votre compte sous peu.\n\nVous serez notifié une fois le processus d'approbation terminé.\n\nCordialement,\nÉquipe E-commerce
email.account_locked.body=Votre compte a été verrouillé en raison de plusieurs tentatives de connexion échouées.\n\nVeuillez contacter le support pour déverrouiller votre compte.\n\nCordialement,\nÉquipe E-commerce
email.password_reset.body=Nous avons reçu une demande de réinitialisation de votre mot de passe.\n\nUtilisez le lien ci-dessous pour le réinitialiser :\n\n{0}\n\nCe lien expirera bientôt. Si vous n'avez pas demandé cela, vous pouvez ignorer cet e-mail.
email.password_changed.body=Votre mot de passe a été récemment modifié.\n\nSi vous n'avez pas effectué cette action, contactez immédiatement le support.\n\nCordialement,\nÉquipe E-commerce
email.account_activated.body=Bonne nouvelle ! Votre compte a été activé avec succès par un administrateur.\n\nVous pouvez maintenant vous connecter et accéder à toutes les fonctionnalités de la plateforme.\n\nCordialement,\nL'équipe E-Commerce
email.account_deactivated.body=Ceci est une notification que votre compte a été désactivé par un administrateur.\n\nSi vous pensez que c'est une erreur, contactez le support.\n\nCordialement,\nL'équipe E-Commerce

